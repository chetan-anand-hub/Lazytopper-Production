name: Golden Eval

# GRADER-CORE-1 PR-1 · G1 + G2 — the zero-call golden gate for the grader (owner grant: one new
# workflow for the zero-call golden scorer).
#
# G1  lazytopper/server/eval/golden/goldenGate.cjs replays the STORED raw model responses of the
#     committed baseline run through the CURRENT post-processing (the real route handlers) and
#     scores them against the golden truth data. The network is HARD-BLOCKED inside that process
#     (every outbound path throws and is counted), so it makes ZERO model calls and needs NO key.
#     It prints one line:  GOLDEN: <metric=value ...> calls=0 floor=<file> verdict=PASS|FAIL
#     and fails when a floor metric regresses (each one named), a stored request no longer
#     re-derives, or any network attempt is made.
# G2  shapes.test.cjs pins the response SHAPE (keys, types, nesting) every live client call site
#     reads today, per P15; requests without acceptsV2 must keep it.
#
# ★ NO SECRETS. This workflow references no API key, no secret and no environment of any kind:
#   the gate cannot call a model by construction, and a test proves the block fires.
# ★ Separate workflow, runs ALONGSIDE quality-gate (zero added wall clock while it finishes
#   first). The relevance decision is not a `paths:` filter, so it can be made required later
#   without becoming a stuck "expected" status (quality-gate.yml records why).
# ★ Node is preinstalled on ubuntu-latest and the gate loads only node built-ins plus
#   lazytopper/server modules that have no npm dependencies — no install step.

# ★★ CI-SPEED-3 (owner order 2026-10-22): NO `pull_request` TRIGGER. On a PR these exact suites
#   already run inside the REQUIRED quality-gate: the lazytopper ops matrix (build-ops job) runs
#   `test:server:golden-eval` (golden.test.cjs, whose §2 spawns goldenGate.cjs on the committed
#   baseline and asserts calls=0 changed=0 verdict=PASS, plus shapes.test.cjs) and
#   `test:server:eval-parity` (graderEval.parity.test.cjs). This workflow was never a required
#   check; it stays on trunk pushes and manual dispatch. ci_speed_acceptance.mjs (w18) fails if the
#   PR trigger is dropped while the ops matrix stops running any of the three suites.
on:
  push:
    branches: [base/approved-thru-437]
  workflow_dispatch:

concurrency:
  group: golden-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # CI-COST-3: a push reads the PREVIOUS trunk push's Golden Eval result before it may skip.
  actions: read

jobs:
  golden-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ★ CI-COST-3: a PUSH needs history to diff `before..HEAD` (commits + trees only, no blobs).
      # Every other event gets exactly the inputs it had before (depth 1, no filter).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          filter: ${{ github.event_name == 'push' && 'blob:none' || '' }}

      - name: Node version
        run: node --version

      # ★ CI-COST-3 (owner-approved 2026-10-19). POST-MERGE ONLY: a push to trunk skips the golden
      # steps when EVERY path in `before..HEAD` is on the shared docs-only skip list AND the previous
      # trunk push's Golden Eval run passed (scripts/ci/docs_only_push.mjs — the CI-COST-2 rule).
      # Pull requests and manual dispatches never run this step and always run the gate. Fails
      # SAFE: a crash leaves `docs_only` unset (continue-on-error) and only the literal 'true' skips.
      - name: Docs-only push? (post-merge skip decision)
        id: docs
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/docs_only_push.mjs --workflow golden-eval.yml

      - name: G1 — golden gate (replay stored responses, zero model calls)
        if: github.event_name != 'push' || steps.docs.outputs.docs_only != 'true'
        working-directory: lazytopper
        run: node server/eval/golden/goldenGate.cjs

      - name: G1 + G2 — golden suites (network block proof, floor control, replay fidelity, response shapes)
        if: github.event_name != 'push' || steps.docs.outputs.docs_only != 'true'
        working-directory: lazytopper
        run: node --test server/eval/golden/golden.test.cjs server/eval/golden/shapes.test.cjs server/eval/graderEval.parity.test.cjs
