name: Lane Overlap

# Collision guard. On every PR into the trunk it checks whether this PR edits any file
# that another OPEN PR also edits -- an overlap means the two branches will conflict on
# merge, so the check FAILS to force sequencing. DRAFT PRs never block: an overlap with
# another PR's draft is a warning, and a draft PR itself passes with a note. It also WARNS when the PR touches a
# gated lane (data / forbidden files / cofounder-skill / .github). READ-ONLY: it lists
# PRs and diffs via the API and mutates nothing. Additive -- does not touch quality-gate.yml.

on:
  pull_request:
    # `ready_for_review` (CI-2): a DRAFT PR passes with a note and other PRs' drafts never
    # block, so the real verdict is taken when a draft is marked ready -- this re-runs it.
    # Pinned by ci_speed_acceptance.mjs (w12). NOT added to quality-gate.yml, by design.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [base/approved-thru-437]
  # ★ READY FOR A FUTURE MERGE QUEUE (FU-CI1-NIGHTLY-RESTORE, controller decision D3). `lane-overlap`
  # is a REQUIRED check, so a queue would wait forever for it unless it reports on merge_group too.
  # On merge_group it is a PASS-THROUGH: every queued PR already passed lane-overlap on its own
  # pull_request run, and a merge group has no single PR whose files to compare.
  merge_group:
    types: [checks_requested]
    branches: [base/approved-thru-437]

# A newer push to the same PR supersedes an in-flight run (merge_group runs group by their ref).
concurrency:
  group: lane-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lane-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # merge_group ONLY — never on pull_request (pinned by ci_speed_acceptance.mjs).
      - name: Lane-overlap pass-through (merge_group)
        if: github.event_name == 'merge_group'
        run: |
          echo "LANE_OVERLAP: N/A on merge_group — every queued PR passed lane-overlap on its own PR run"
          exit 0

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Use Node.js 22
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lane-overlap check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ops/lane_overlap.mjs
