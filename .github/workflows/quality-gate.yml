name: Quality Gate

# Workflows are only registered when they live in the REPO ROOT .github/workflows/.
# (The predecessor lived in lazytopper/.github/workflows/ and therefore never ran.)
#
# Gates the full integration bar on linux runners — the platform the build is pinned to
# (pnpm-workspace.yaml strips all non-linux-x64 binaries). Mirrors the local gates documented
# in CLAUDE.md section 6.
#
# ★★ CI-SPEED-1 — SAME COVERAGE, RUN IN PARALLEL. Until CI-SPEED-1 this was ONE job doing
# everything in sequence on one 4-vCPU runner (~20-26 min; the vitest suite ran three times,
# ~6.4 min each, and the ops matrix three times). It is now parallel jobs:
#   classify      decides docs-only fast path vs the full bar (the module below)
#   docs-lane     mojibake (EVERY path) + the classifier's own acceptance + root guard matrix (docs path)
#   static        Firestore rules, root guard matrix, root typecheck, edge security tests, test typecheck
#   build-ops     build + the lazytopper ops matrix
#   railway-build the ROOT `pnpm run build` exactly as the Railway backend image runs it (Node 24,
#                 frozen install WITH devDependencies, no .git) — RAILWAY-BUILD-GATE
#   vitest        the WHOLE vitest suite, sharded 1/4..4/4 (every file runs exactly once)
#   clock         the date-sensitive manifest + the whole ops matrix, at 2030 and at IST midnight
#   quality-gate  the AGGREGATE. Its name is the REQUIRED status check in the trunk ruleset; it
#                 fails unless every job above passed (or, on the docs path, was skipped BY DESIGN),
#                 and unless the vitest shards together ran every test file on disk.
#   nightly-full-clock  nightly (02:00 IST) + manual dispatch: the FULL vitest suite + ops matrix
#                 under both clocks (schedule restored by FU-CI1-NIGHTLY-RESTORE).
# NOTHING WAS REMOVED FROM THE FULL BAR. Every test the old single job ran still runs on every
# full-bar run; only the two clock re-runs of vitest are narrowed to the manifest (the full set
# runs in nightly-full-clock, every night and on manual dispatch), and lazytopper/scripts/testClock/clockRecorder.setup.mjs fails the normal run if
# a test that reads the clock is missing from that manifest.
#
# ★★ THE FULL BAR IS STILL THIS PROJECT'S ONLY PRE-MERGE INTEGRATION CHECK, so the classifier is
# biased towards running it: a push to this branch ALWAYS runs everything (every merge produces
# one), and anything the classifier cannot confidently classify runs everything. A docs-only PR
# (wave-closing handoffs included since CI-SPEED-1) takes the fast path; add `[ci-full]` to its
# title to force the full bar.
#
# ★ THE CLASSIFICATION HAPPENS INSIDE THE WORKFLOW, DELIBERATELY — never as a workflow-level
# `paths-ignore`. `quality-gate` is a REQUIRED status check, and a required check that never
# runs leaves the PR stuck on "expected — waiting for status": unmergeable, with no error. The
# aggregate job always runs and always reports.
#
# ★ The rules live in lazytopper/scripts/ops/ci_docs_lane_acceptance.mjs, which is also the
# acceptance suite that pins them. One file on purpose: a second copy of a classifier drifts,
# and the suite keeps testing the first one.

on:
  pull_request:
    branches: [base/approved-thru-437]
  push:
    branches: [base/approved-thru-437]
  # The FULL CLOCK RUN (job nightly-full-clock); a scheduled failure opens an issue.
  # ★ FU-CI1-NIGHTLY-RESTORE (owner mandate 2026-10-07): the schedule is back, together with the
  # C&I convergence gate's N/A rule for EVERY non-PR event (push, schedule, workflow_dispatch,
  # merge_group) — before it, a dispatch run went RED on "FORBIDDEN: the PR base ref is reachable
  # in CI" (run 37514040888). Pinned by ci_speed_acceptance.mjs (w1) and the gate's FORBIDDEN-PIN.
  schedule:
    - cron: '30 20 * * *'   # 20:30 UTC = 02:00 IST
  workflow_dispatch:
  # ★ READY FOR A FUTURE MERGE QUEUE (controller decision D3). Inert until the trunk ruleset turns
  # a queue on. A merge_group run has no PR base ref, so the classifier fails closed to the FULL
  # bar ("event=merge_group is not a pull_request") and the convergence gate reports N/A. Its ref
  # (gh-readonly-queue/...) and the event name in the concurrency group keep it from cancelling,
  # or being cancelled by, a PR run.
  merge_group:
    types: [checks_requested]
    branches: [base/approved-thru-437]

permissions:
  contents: read

# A newer push to the same PR/branch supersedes an in-flight run. The EVENT is part of the
# group so a nightly/dispatched run, a merge_group run and a PR/trunk push run never cancel each other.
concurrency:
  group: quality-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ★★ THE DECISION. Delegated to the module that is ALSO its own acceptance suite. It derives the
  # changed-file list from `git merge-base origin/<base> HEAD` recomputed HERE, at run time — this
  # repo SQUASH-merges, and a squash diffs against the base AT MERGE TIME (#566 landed 13 files
  # while reporting 4). That is why `fetch-depth: 0` and the base fetch are load-bearing: without
  # them merge-base fails, which reports "unresolved", which runs the FULL bar. It never exits
  # non-zero, and the `!= 'true'` polarity below means even a MISSING output runs everything.
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      verdict: ${{ steps.classify.outputs.verdict }}
      inspected: ${{ steps.classify.outputs.inspected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch PR base branch (for the merge-base diff)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Classify the change set (docs-only fast path, or the full bar)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node lazytopper/scripts/ops/ci_docs_lane_acceptance.mjs --classify
      # ★ SAY WHICH PATH THIS RUN TOOK, IN THE RUN.
      - name: Which path did this run take
        if: always()
        run: |
          echo "CI_DOCS_LANE_PATH_TAKEN: ${{ steps.classify.outputs.verdict || 'unclassified (full bar)' }}"
          echo "CI_DOCS_LANE_PATH_INSPECTED_FILES: ${{ steps.classify.outputs.inspected || 'n/a' }}"
          echo "CI_DOCS_LANE_PATH_FULL_BAR_RAN: ${{ steps.classify.outputs.docs_only != 'true' }}"

  # Runs on EVERY path. The mojibake step is the one gate a markdown-only change can fail.
  docs-lane:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          # pnpm 10.32.1: matches the lockfile and sets npm_config_user_agent for the root
          # preinstall guard (pnpm 11 leaves it empty on linux -> "Use pnpm instead").
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # ★★ UNGATED, ON EVERY PATH, DELIBERATELY. ENFORCED on the tracked tree, REPORT-ONLY on
      # handoff/ (deliberate mojibake specimens). Read `enforced_hits` / `report_only_hits` from
      # this step's log. DO NOT PUT AN `if:` ON THIS STEP.
      - name: Mojibake check (lazytopper)
        run: pnpm --filter lazytopper run check:mojibake
      # ★ THE FAST PATH'S OWN GATES. On the full bar the docs-lane suite runs inside the ops matrix
      # and the root guard matrix inside `static`; on the docs path they run here, alone. The root
      # guard matrix reads handoff/ and ops/ markdown (premise ledger, lane overlap), which is
      # exactly what a docs PR changes.
      - name: Docs-lane classifier acceptance (fast path)
        if: needs.classify.outputs.docs_only == 'true'
        run: pnpm --filter lazytopper run test:ci:docs-lane
      - name: Root guard matrix on the docs path (scripts/ test:matrix:all)
        if: needs.classify.outputs.docs_only == 'true'
        run: pnpm --filter @workspace/scripts run test:matrix:all

  static:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # The Firestore emulator is a Java process. Pinned rather than inherited from the image,
      # or the security gate silently stops running one day and still reports green.
      - name: Set up Java (runtime for the Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The REAL Firestore emulator against the REAL firestore.rules. MERGING THIS DOES NOT DEPLOY
      # IT: firestore.rules ships only via `deploy:firestore-rules`, an owner action outside CI.
      - name: Firestore rules tests (subscriptions premium self-grant)
        timeout-minutes: 10
        run: pnpm run test:firestore-rules
      # --- Root guard matrix ---
      # ★ NO TOTAL IS WRITTEN HERE, ON PURPOSE. Read the totals from this step's own log — the
      # suite prints them on the run you are actually looking at, and the matrix grows with every
      # guard added. [FU-CI-WORKFLOW-STALE-MATRIX-COUNT]
      - name: Root guard matrix (scripts/ test:matrix:all)
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/scripts run test:matrix:all
      # The ROOT typecheck builds the lib/* project references first, then checks api-server and
      # scripts (api-server alone fails TS6305). artifacts/api-server is the production front door.
      - name: Typecheck (root — libs, api-server, scripts)
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      # Behavioural CORS/helmet tests against a real listening Express app; asserts OBSERVED
      # response headers, never config keys.
      - name: Edge security tests (api-server CORS allowlist + helmet)
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/api-server run test
      # tsconfig.app.json EXCLUDES the test files; tsconfig.test.json covers them.
      - name: Typecheck test files (lazytopper)
        if: ${{ !cancelled() }}
        run: pnpm --filter lazytopper run typecheck:test

  build-ops:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # FULL history: the C&I convergence gate (in the ops matrix) anchors its moat check to a
          # FIXED commit; a shallow checkout silently skipped its hardest checks.
          fetch-depth: 0
      - name: Fetch PR base branch (for the convergence gate's PR-scoped diff)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # The ops-matrix audits shell out to `rg`; ubuntu-latest does not ship it.
      - name: Install ripgrep (required by ops-matrix audits)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # None of the steps below reads Build's output, so each runs after a failed Build too
      # (`!cancelled()`); the JOB STILL FAILS when Build fails. (FU-QG-BUILD-MASKS-VITEST)
      - name: Build (lazytopper)
        run: pnpm --filter lazytopper run build
      - name: Ops matrix (lazytopper test:matrix:all)
        if: ${{ !cancelled() }}
        run: pnpm --filter lazytopper run test:matrix:all
      # Date-sensitive manifest: static guard + CI-speed acceptance (Vercel ignore step replay,
      # aggregate rules, workflow wiring). The runtime guard lives in every vitest shard.
      - name: Date-sensitive clock selection guard + CI-speed acceptance
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node lazytopper/scripts/testClock/dateSensitive.mjs --guard
          node lazytopper/scripts/ops/ci_speed_acceptance.mjs

  # ★★ RAILWAY-BUILD-GATE (owner order 2026-10-07): the ROOT build, EXACTLY as the Railway
  # backend image runs it, so a PR that would break the backend deploy fails HERE first.
  # #985 merged green and then failed every Railway build after it: the root build runs
  # validateQuestionBanks, which no other job here runs, and Container Boot skipped the image
  # build because #985 touched no "image-relevant" path. This job mirrors the Dockerfile:
  #   FROM node:24-slim                       -> Node 24 (every other job here uses 22)
  #   corepack prepare pnpm@10.32.1 --activate -> same
  #   pnpm install --frozen-lockfile          -> same, WITH devDependencies. NEVER `--prod`:
  #       the gateway needs `typescript` at runtime and the build starts with `tsc`; a --prod
  #       install fails at `tsc` where Railway passes (RAILWAY-BUILD-GATE R1, proven once).
  #   pnpm run build (root, unfiltered)       -> same script: typecheck -> syllabusGuard ->
  #       validateQuestionBanks -> api-server + lazytopper builds
  #   .dockerignore drops .git                -> .git is moved aside for the build (the only
  #       build step that reads git, writeVersion.ts, then logs its no-SHA warning, as in the image)
  # Skipped on the docs-only fast path: markdown under handoff/ ops/ docs/ cannot change any
  # input of the root build. Judged by the aggregate `quality-gate` below like every full-bar job.
  # fetch-depth 1: no step of the root build reads history.
  railway-build:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Enable pnpm (corepack, pinned as in the Dockerfile)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 24 (the Railway image is node:24-slim)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace (frozen lockfile, WITH devDependencies, as the Dockerfile)
        run: pnpm install --frozen-lockfile
      - name: Root build exactly as Railway runs it (pnpm run build, no .git like the image)
        run: |
          set -euo pipefail
          node --version
          mv .git "$RUNNER_TEMP/dotgit-hidden"
          trap 'mv "$RUNNER_TEMP/dotgit-hidden" .git' EXIT
          pnpm run build

  # --- Vitest render/unit suites, SHARDED ---
  # ★ HOW MANY FILES AND TESTS? READ THEM FROM THE LOG — each shard prints vitest's "Test Files" /
  # "Tests" lines and a VITEST_SHARD_SUMMARY line, and the quality-gate job prints VITEST_TOTAL
  # (the shards summed) and fails unless that sum equals the test files on disk. No figure is
  # written here on purpose. [FU-CI-WORKFLOW-STALE-MATRIX-COUNT]
  # NEVER add a new --exclude here: a red vitest suite fails CI, which is the point.
  # HEAP: maxWorkers 2 (vitest.config.ts) x 2048 MB per runner. [FU-VITEST-CI-HEAP-CEILING]
  # SHARD COUNT 4 is MEASURED (CI-SPEED-1 report): the unsharded pass took 4.9-6.6 min over the
  # last 10 runs and the slowest file ~40 s; 4 shards put each near 1.5-2 min of tests.
  vitest:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: vitest (${{ matrix.shard }}/4)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Read this shard's totals from this step's own log (vitest's "Test Files" / "Tests" lines);
      # the quality-gate job's log carries VITEST_TOTAL for all shards together.
      - name: Vitest suites (lazytopper)
        timeout-minutes: 20
        run: pnpm --filter lazytopper exec vitest run --shard ${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-shard.json"
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Shard summary (files and tests this shard ran)
        if: ${{ !cancelled() }}
        run: node lazytopper/scripts/ops/ci_aggregate.mjs --shard-summary "$RUNNER_TEMP/vitest-shard.json" "$RUNNER_TEMP/summary/vitest-shard-${{ matrix.shard }}.json" --shard=${{ matrix.shard }}/4
      - name: Upload shard summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/summary/vitest-shard-${{ matrix.shard }}.json
          retention-days: 7

  # ★ NO TEST MAY DEPEND ON TODAY'S DATE (TEST-CLOCK-SWEEP). "now" moved to a fixed day in 2030
  # and to IST midnight in board season. How the clock moves: lazytopper/scripts/testClock/
  # (vitest via src/test/setup.ts; node suites via the --import preload in NODE_OPTIONS). The
  # self-check runs FIRST and exits 1 if the switch is set but not in effect. Read the effective
  # now from the log: "[test-clock] SELF-CHECK OK ... effective now=2030-...".
  # ★ CI-SPEED-1: vitest here runs ONLY the date-sensitive manifest (date-sensitive-tests.json);
  # the whole ops matrix still runs. The nightly-full-clock job (nightly + manual dispatch) runs
  # the FULL vitest suite.
  clock:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each clock is split in two halves of the manifest (vitest --shard x/2); the ops matrix
      # runs once per clock, in part 1. The manifest is ~70% of the suite's test time (the runtime
      # recorder found product code reading the clock in about half the files), so one job per
      # clock would be the slowest job of the run.
      matrix:
        include:
          - name: '2030'
            at: '2030-06-15T06:30:00.000Z'
            part: 1
          - name: '2030'
            at: '2030-06-15T06:30:00.000Z'
            part: 2
          - name: ist-midnight
            at: '2030-02-14T18:45:00.000Z'
            part: 1
          - name: ist-midnight
            at: '2030-02-14T18:45:00.000Z'
            part: 2
    name: clock (${{ matrix.name }} ${{ matrix.part }}/2)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch PR base branch (for the convergence gate's PR-scoped diff)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install ripgrep (required by ops-matrix audits)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test clock (date-sensitive manifest + ops matrix, LT_TEST_CLOCK)
        timeout-minutes: 30
        env:
          LT_TEST_CLOCK: ${{ matrix.at }}
        run: |
          set -euo pipefail
          PRELOAD="--import file://${GITHUB_WORKSPACE}/lazytopper/scripts/testClock/preload.mjs"
          NODE_OPTIONS="$PRELOAD" node lazytopper/scripts/testClock/selfCheck.mjs
          FILES="$(node lazytopper/scripts/testClock/dateSensitive.mjs --print=vitest)"
          echo "CLOCK_MANIFEST_FILES: $(printf '%s\n' "$FILES" | wc -l)"
          NODE_OPTIONS="--max-old-space-size=2048 $PRELOAD" pnpm --filter lazytopper exec vitest run --shard ${{ matrix.part }}/2 $FILES
          if [ "${{ matrix.part }}" = "1" ]; then
            NODE_OPTIONS="$PRELOAD" pnpm --filter lazytopper run test:matrix:all
          fi

  # ★ THE REQUIRED CHECK. The trunk ruleset requires a check named exactly `quality-gate`; this
  # job carries that name. `if: always()` so it reports even when an upstream job failed, was
  # cancelled or was skipped; lazytopper/scripts/ops/ci_aggregate.mjs then FAILS unless every
  # upstream job succeeded — or, on the docs path only, the full-bar jobs were skipped — and,
  # on the full bar, unless all 4 vitest shards reported and together ran every test file.
  quality-gate:
    needs: [classify, docs-lane, static, build-ops, railway-build, vitest, clock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the aggregate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            lazytopper/scripts/ops
            lazytopper/src
          fetch-depth: 1
      - name: Download vitest shard summaries
        if: needs.classify.outputs.docs_only != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-*
          path: ${{ runner.temp }}/summary
          merge-multiple: true
      - name: Every upstream job passed (or was skipped by the docs fast path)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          SHARD_DIR: ${{ runner.temp }}/summary
          EXPECTED_SHARDS: '4'
        run: node lazytopper/scripts/ops/ci_aggregate.mjs --aggregate

  # The FULL vitest suite and the FULL ops matrix under BOTH clocks — what every PR ran before
  # CI-SPEED-1 narrowed the clock jobs to the manifest. Every night at 02:00 IST (`schedule:`,
  # restored by FU-CI1-NIGHTLY-RESTORE) and on demand (Actions -> Quality Gate -> Run workflow).
  # Only a SCHEDULED failure opens an issue; a dispatch run reports in its own run page.
  nightly-full-clock:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '2030'
            at: '2030-06-15T06:30:00.000Z'
          - name: ist-midnight
            at: '2030-02-14T18:45:00.000Z'
    name: nightly-full-clock (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install ripgrep (required by ops-matrix audits)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Full suites under the test clock (LT_TEST_CLOCK)
        timeout-minutes: 40
        env:
          LT_TEST_CLOCK: ${{ matrix.at }}
        run: |
          set -euo pipefail
          PRELOAD="--import file://${GITHUB_WORKSPACE}/lazytopper/scripts/testClock/preload.mjs"
          NODE_OPTIONS="$PRELOAD" node lazytopper/scripts/testClock/selfCheck.mjs
          NODE_OPTIONS="--max-old-space-size=2048 $PRELOAD" pnpm --filter lazytopper exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-nightly.json"
          NODE_OPTIONS="$PRELOAD" pnpm --filter lazytopper run test:matrix:all
      # ★ D7 (FU-CI1-NIGHTLY-RESTORE): the unsharded run must collect EVERY test file on disk — the
      # same files-on-disk rule the PR's quality-gate aggregate applies to the 4 shards, counted by
      # ci_aggregate.mjs's own functions (one counter, never a second copy). It also refuses a run
      # that failed or skipped a test. Read NIGHTLY_VITEST_TOTAL / NIGHTLY_VITEST_COVERAGE here.
      - name: Every test file on disk ran (files = files on disk)
        if: ${{ !cancelled() }}
        env:
          VITEST_JSON: ${{ runner.temp }}/vitest-nightly.json
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          import { countTestFilesOnDisk, summariseVitestJson } from "./lazytopper/scripts/ops/ci_aggregate.mjs";
          let json = {};
          try { json = JSON.parse(fs.readFileSync(process.env.VITEST_JSON, "utf8")); } catch (e) { console.error(`no vitest JSON: ${e.message}`); }
          const s = summariseVitestJson(json, "1/1");
          const onDisk = countTestFilesOnDisk();
          console.log(`NIGHTLY_VITEST_TOTAL: files=${s.files} (on disk ${onDisk}) tests=${s.tests} passed=${s.passed} failed=${s.failed} skipped=${s.skipped} todo=${s.todo}`);
          const ok = s.files > 0 && s.files === onDisk && s.failed === 0 && s.skipped === 0;
          console.log(`NIGHTLY_VITEST_COVERAGE: ${ok ? "PASS" : "FAIL"}`);
          if (!ok) process.exit(1);
          '
      - name: Open an issue (scheduled run failed)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly full clock run failed (${{ matrix.name }}) on ${GITHUB_SHA::8}" \
            --body "The nightly FULL vitest suite + ops matrix under LT_TEST_CLOCK=${{ matrix.at }} failed on ${GITHUB_SHA}. Run: ${RUN_URL}. A test that depends on the date is either missing from lazytopper/scripts/testClock/date-sensitive-tests.json or broken at this clock."
