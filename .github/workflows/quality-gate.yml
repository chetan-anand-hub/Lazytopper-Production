name: Quality Gate

# Workflows are only registered when they live in the REPO ROOT .github/workflows/.
# (The predecessor lived in lazytopper/.github/workflows/ and therefore never ran.)
#
# Gates the full integration bar on a linux runner — the platform the build is
# pinned to (pnpm-workspace.yaml strips all non-linux-x64 binaries). Mirrors the
# local gates documented in CLAUDE.md section 6.

on:
  pull_request:
    branches: [base/approved-thru-437]
  push:
    branches: [base/approved-thru-437]

# A newer push to the same PR/branch supersedes an in-flight run.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 = FULL history. Required, and it closes a silent hole: the
          # C&I convergence acceptance gate anchors its MISTAKE-INTELLIGENCE moat check
          # to a FIXED commit (e8f75af — the convergence's PR-1 base). A depth-1 checkout
          # did not contain that commit, so the gate's hardest checks SILENTLY SKIPPED on
          # every run, including "fully green" ones. The anchor is a permanent SHA and
          # recedes as trunk advances, so no fixed shallow depth reaches it durably —
          # only full history does. Cost: this repo is ~1,400 commits / ~170 MB; the
          # extra fetch is a few seconds on the linux runner, paid once per run.
          fetch-depth: 0

      # On a pull_request the merge ref is checked out but the TARGET branch is not a
      # named remote-tracking ref. The convergence gate scopes its forbidden-path diff
      # to the PR's own changes (merge-base with the target), so make that ref exist.
      # Skipped on push-to-trunk, where github.base_ref is empty and the gate correctly
      # reports the forbidden diff as N/A (there is no PR to scope against).
      - name: Fetch PR base branch (for the convergence gate's PR-scoped diff)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Enable pnpm (corepack)
        # Repo is a pnpm workspace (lockfileVersion 9.0); npm install is blocked
        # by a root preinstall guard and scripts/ uses pnpm `catalog:` refs.
        run: |
          corepack enable
          # Pin pnpm to the version the lockfile was regenerated + frozen-verified with on
          # linux (#201). The root preinstall guard is `case "$npm_config_user_agent" in pnpm/*)`,
          # and pnpm 11 leaves npm_config_user_agent EMPTY for the workspace-root lifecycle
          # script on linux -> the guard prints "Use pnpm instead" and exits 1. pnpm 10.32.1
          # sets it correctly AND matches the lockfile's overrides serialization.
          # (Follow-up: add "packageManager":"pnpm@10.32.1" to root package.json so Corepack
          #  enforces one version everywhere; and fix the guard before any move to pnpm 11.)
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # The lazytopper ops-matrix acceptance scripts (llm_path_audit, bsre_spike, etc.)
      # shell out to `rg` (ripgrep) and have no fallback — ubuntu-latest does not ship it.
      # Install it so those audits behave as they do locally / in the Codespace.
      # (git/node/npm are already present; no other non-standard tool is on the gate path.)
      - name: Install ripgrep (required by ops-matrix audits)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # --- Root guard matrix: 5 suites, 175/175 ---
      - name: Root guard matrix (scripts/ test:matrix:all)
        run: pnpm --filter @workspace/scripts run test:matrix:all

      # --- lazytopper gates ---
      - name: Mojibake check (lazytopper)
        run: pnpm --filter lazytopper run check:mojibake

      - name: Build (lazytopper)
        run: pnpm --filter lazytopper run build

      - name: Ops matrix (lazytopper test:matrix:all)
        run: pnpm --filter lazytopper run test:matrix:all

      # --- Vitest render/unit suites (the .test.tsx / .test.ts files) ---
      # Runs ONLY here on linux: pnpm-workspace.yaml strips the non-linux rollup
      # binary, so Windows dev boxes cannot run vitest at all (CLAUDE.md section 6).
      # These 59 suites were NEVER gated in CI before — the root cause behind this
      # repo's green-but-broken builds (#484, #490): the tests that would have caught
      # them never executed. Required gate now — a red vitest fails CI.
      # Resolves [FU-CI-GATE-VITEST].
      #
      # TRACKED DEBT — CLEARED. Four suites were RED on trunk (57ea912) when this gate
      # landed and were EXCLUDED so it could be introduced without blocking every PR on
      # pre-existing failures. All four have since been repaired and re-included, so the
      # step now runs the WHOLE suite with no exclusions:
      #   [FU-CONCEPTSPINE-TEST-STALE]      ConceptSpine.test.tsx       — stale expectation
      #     (the trigonometry note is now SEEDED, so Notes opens the real NoteModal instead
      #      of the "coming soon" placeholder); both branches are asserted now.
      #   [FU-OBJSCORING-PARITY-TEST-RED]   objectiveScoring.parity     — wrong relative
      #     import path (`../../lib/...` from src/services/); born broken in #348.
      #   [FU-PRACTICEINSIGHTS-DURABLE-RED] practiceInsights.durable    — stale expectation
      #     (`mode` was deliberately dropped from the attempt dedup key / doc id in #445).
      #   [FU-WORKSHEET-PDFEXPORT-TEST-RED] worksheetPdfExport.test.ts  — test-harness bugs
      #     (asserted the capture host AFTER the exporter had torn it down; and a
      #      `vi.fn().mockImplementation` jsPDF constructor loses its implementation to
      #      `vi.restoreAllMocks()`, so every test after the first got a bare `{}`).
      # NEVER add a new --exclude here: a red vitest suite fails CI, which is the point.
      - name: Vitest suites (lazytopper)
        run: pnpm --filter lazytopper exec vitest run
