# search-ping — tells search engines which pages changed, after every PRODUCTION deploy.
#
# SEO-FRESH-1 (F4 + F5). Vercel posts a GitHub `deployment_status` for every deployment
# it makes. Verified for this repo (gh api .../deployments): production deployments carry
# environment "Production" and reach state "success"; previews carry "Preview"; Railway
# also posts, as "lazytopper-backend / production".
#
# ⚠ THE FILTER IS AN EXACT MATCH ON "Production", AND THE CASE MATTERS. A case-insensitive
# or `contains(...)` match on "production" would also fire on Railway's backend deploys.
# Previews and pull requests never ping: a preview URL is not a page anyone should index.
# `searchPing.guard.test.ts` evaluates this condition against those real event shapes.
#
# What it does (lazytopper/scripts/seo/searchPing.ts):
#   · SEARCHPING-2 — WAITS FOR THE RELEASE TO BE LIVE FIRST. Vercel Rolling Releases shifts
#     traffic 10% -> 50% -> 100% over ~15 minutes after this event fires. Step "Wait for the
#     rollout" polls https://www.lazytopper.com/app/version.json (every build writes the
#     commit SHA there) until 5 CONSECUTIVE reads return this commit, for at most 30
#     minutes. Live -> the ping step runs. www serving a newer commit that descends from this
#     one -> clean exit, NO ping (that release's run pings). Timeout -> the job fails, no ping;
#   · diffs public/sitemap.xml between the head commit of the last search-ping run whose
#     ping step succeeded (parent only if there is none) and the deployed commit — `gen:sitemap`
#     restamps a URL only when its prerendered page changed, so the new/restamped <loc>s
#     ARE the changed pages;
#   · POSTs them to IndexNow (Bing & friends). No changed URLs → no request. Any status
#     other than 200/202 fails this job, visibly;
#   · if the GSC_SERVICE_ACCOUNT secret exists, resubmits the sitemap to Google Search
#     Console (sitemaps.submit); if not, logs a notice and succeeds. No other Google call.
#
# SEARCHPING-2b — MANUAL DISPATCH. Vercel has at times posted NO `Production`
# deployment_status after a Rolling Release completes (FU-SEARCHPING-NO-PROD-DEPLOYMENT-EVENT),
# so nothing fires. `workflow_dispatch` runs the SAME job for one SHA (input `sha`, default
# the dispatched ref's HEAD): the same wait, the same last-ping diff, the same IndexNow/GSC.
# The pinged SHA is resolved ONCE, in this order, everywhere below:
#   github.event.deployment.sha (deployment_status) || inputs.sha || github.sha (dispatch).
# `run-name` carries it, because a dispatched run's headSha is the ref's HEAD, not the
# input — S3 reads the pinged SHA from the run title (searchPing.ts pingRunSha).
#
# SEARCHPING-3 — EVERY TRUNK PUSH (owner ruling Q3, 2026-09-28). Rolling Releases post no
# GitHub Production deployment_status (FU-SEARCHPING-NO-PROD-DEPLOYMENT-EVENT, closed here),
# so `push` on base/approved-thru-437 is now the automatic trigger. It runs the SAME job for
# `github.sha` (the pushed commit — the resolution order above falls through to it): the same
# 5-in-a-row version.json wait, 30-minute cap, descendant -> clean exit, timeout -> red, and
# the same S3 diff from the last successful ping.
#   · NO path filter: a path filter would also skip the wait for a commit that DOES go live
#     and can supersede the previous one.
#   · CI-SPEED-1: a docs-only push that Vercel's ignoreCommand did NOT deploy is detected by
#     step "Skip if the deploy was ignored" (what www serves is an ancestor, and every file
#     since is deploy-inert by the same classifier) — the run exits GREEN with
#     "deploy skipped by ignoreCommand: nothing new to ping", no wait, no ping.
#   · deployment_status is kept exactly as is. If Vercel ever posts one again, its run shares
#     this SHA's concurrency group, so it QUEUES behind the push run (never pings at the same
#     time), and then either diffs from the push run's ping (changed=0) or, if www has moved
#     on to a descendant, exits superseded.
name: search-ping
run-name: search-ping ${{ github.event.deployment.sha || inputs.sha || github.sha }}

on:
  deployment_status:
  # SEARCHPING-3 — the automatic trigger. Trunk only; no paths filter (see above).
  push:
    branches: [base/approved-thru-437]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to wait for and ping (default: the dispatched ref's HEAD)"
        required: false
        default: ""

permissions:
  contents: read
  # `gh run list` / `gh run view` — finding the last run that actually pinged (S3).
  actions: read

# Keyed by the SHA being pinged, so a push run, a dispatched run and an event run for the
# same commit can never ping at once (the second waits; cancel-in-progress stays false).
concurrency:
  group: search-ping-${{ github.event.deployment.sha || inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  ping:
    # A trunk push or a dispatch always runs (the push branch filter is in `on:`); a
    # deployment_status runs ONLY on Production success (unchanged).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    # The rollout wait alone may take 30 minutes (S2).
    timeout-minutes: 50

    # ⚠ `secrets` is NOT available in a step-level `if`; resolve presence here (the same
    # pattern prerender-capture.yml documents).
    env:
      HAS_GSC: ${{ secrets.GSC_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || inputs.sha || github.sha }}
          # Full history: the sitemap is diffed against the last PINGED release, which may be
          # several commits back, and the wait checks whether a newer served commit descends
          # from this one.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # CI-SPEED-1 (owner ruling 2026-10-07, "Amend guard in #969"). vercel.json's ignoreCommand
      # skips a production build when everything since the deployed commit is deploy-inert
      # markdown; www then never serves this SHA and the wait below would time out red. This step
      # reads what www ACTUALLY serves and sets skipped=true ONLY when that commit is an ancestor
      # of this one and every file in between is deploy-inert by vercel_ignore_build.mjs's own
      # classifier (lazytopper/scripts/ops/searchping_inert_skip.mjs — no path rule lives here).
      # ★ FAILS TOWARD WAITING: any other outcome writes skipped=false; a crash leaves the output
      # unset (continue-on-error), and the wait's condition is `!= 'true'`, so it still runs.
      - name: Skip if the deploy was ignored (deploy-inert docs only)
        id: inert
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha || inputs.sha || github.sha }}
        run: pnpm --filter lazytopper exec tsx scripts/seo/searchPing.ts --sha="$DEPLOY_SHA" --inert-skip-check

      - name: Wait for the rollout to reach www
        id: rollout
        if: steps.inert.outputs.skipped != 'true'
        timeout-minutes: 35
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha || inputs.sha || github.sha }}
        run: pnpm --filter lazytopper exec tsx scripts/seo/searchPing.ts --sha="$DEPLOY_SHA" --wait

      # ⚠ This step's NAME is load-bearing: a later run treats a past run as "pinged" only if
      # a step with exactly this name concluded success in it (searchPing.ts PING_STEP_NAME).
      - name: Ping IndexNow (and Search Console when configured)
        if: steps.inert.outputs.skipped != 'true' && steps.rollout.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.deployment.sha || inputs.sha || github.sha }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: |
          echo "Deployment ${{ github.event.deployment.id }} (${{ github.event.deployment.environment }}) state=${{ github.event.deployment_status.state }} sha=$DEPLOY_SHA gsc_configured=$HAS_GSC"
          pnpm --filter lazytopper exec tsx scripts/seo/searchPing.ts --sha="$DEPLOY_SHA"
