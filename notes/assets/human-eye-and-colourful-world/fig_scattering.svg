<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Very fine particles scatter mainly blue light, making the clear sky look blue, while particles of larger size scatter light of longer wavelengths">
  <title>Scattering of light</title>
  <desc>Original teaching diagram. NCERT Science Class 10, The Human Eye and the Colourful World (ch.10), section 10.6, p169: "Very fine particles scatter mainly blue light while particles of larger size scatter light of longer wavelengths." No NCERT figure exists for scattering; this diagram draws only that sentence.</desc>
  <rect width="400" height="300" fill="#fcfdfe"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <!-- incoming white light -->
    <line x1="16" y1="150" x2="94" y2="150" stroke="#0f2444" stroke-width="1.8"/>
    <path d="M 104 150 L 91 144 L 91 156 Z" fill="#0f2444"/>
    <text x="16" y="140" font-size="11" fill="#5a6472">sunlight (white)</text>

    <!-- FINE PARTICLES -->
    <text x="120" y="46" font-size="12.5" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">Very fine particles</text>
    <circle cx="150" cy="92" r="4" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <circle cx="182" cy="76" r="4" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <circle cx="168" cy="112" r="4" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <g stroke="#3b6fd4" stroke-width="2" fill="none">
      <line x1="150" y1="92" x2="112" y2="62"/>
      <line x1="182" y1="76" x2="214" y2="52"/>
      <line x1="168" y1="112" x2="140" y2="136"/>
      <line x1="182" y1="76" x2="222" y2="92"/>
    </g>
    <text x="230" y="72" font-size="12.5" fill="#2f59ad" font-weight="600">scatter mainly</text>
    <text x="230" y="88" font-size="12.5" fill="#2f59ad" font-weight="600">BLUE light</text>
    <text x="230" y="107" font-size="11" fill="#5a6472">&#8594; the clear sky looks blue</text>

    <line x1="112" y1="158" x2="386" y2="158" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- LARGER PARTICLES -->
    <text x="120" y="192" font-size="12.5" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">Particles of larger size</text>
    <circle cx="154" cy="234" r="9" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <circle cx="192" cy="252" r="9" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <g stroke="#c86a2a" stroke-width="2" fill="none">
      <line x1="154" y1="234" x2="118" y2="212"/>
      <line x1="192" y1="252" x2="228" y2="274"/>
      <line x1="192" y1="252" x2="234" y2="240"/>
    </g>
    <text x="244" y="238" font-size="12.5" fill="#a8551f" font-weight="600">scatter LONGER</text>
    <text x="244" y="254" font-size="12.5" fill="#a8551f" font-weight="600">wavelengths</text>
  </g>
</svg>
