<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A convex lens with its focal length f marked, and the power of the lens P equals one over f in dioptres">
  <title>Power of a lens</title>
  <desc>Original teaching diagram. NCERT Science Class 10, Light - Reflection and Refraction (ch.9), p157-158 defines the power of a lens as the reciprocal of its focal length, P = 1/f (equation 9.11), and states that 1 dioptre is the power of a lens whose focal length is 1 metre. No NCERT figure exists for this definition; this diagram draws only the quantities that text names.</desc>
  <rect width="400" height="300" fill="#fcfdfe"/>

  <!-- principal axis -->
  <line x1="28" y1="150" x2="372" y2="150" stroke="#c3cbd6" stroke-width="1.2"/>

  <!-- convex lens -->
  <path d="M 190 78 Q 222 150 190 222 Q 158 150 190 78 Z" fill="#eaf8f1"/>
  <path d="M 190 78 Q 222 150 190 222 Q 158 150 190 78 Z" fill="none" stroke="#16b96a" stroke-width="2.5"/>

  <!-- optical centre -->
  <circle cx="190" cy="150" r="3" fill="#0f2444"/>

  <!-- focal point -->
  <circle cx="308" cy="150" r="3.5" fill="#16b96a"/>

  <!-- f measure -->
  <line x1="190" y1="120" x2="308" y2="120" stroke="#0f2444" stroke-width="1.8"/>
  <line x1="190" y1="114" x2="190" y2="126" stroke="#0f2444" stroke-width="1.8"/>
  <line x1="308" y1="114" x2="308" y2="126" stroke="#0f2444" stroke-width="1.8"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="168" y="242" font-size="11" fill="#5a6472">optical centre</text>
    <text x="304" y="172" font-size="12.5" fill="#0e8f52" font-weight="600">F</text>
    <text x="244" y="110" font-size="12.5" fill="#0f2444">f</text>

    <text x="34" y="198" font-size="12.5" fill="#0e8f52" font-weight="600">P = 1 / f</text>
    <text x="34" y="216" font-size="11" fill="#5a6472">f in metres &#8594; P in dioptres</text>
    <text x="34" y="266" font-size="12.5" fill="#0f2444">1 D = 1 m&#8315;&#185;</text>
    <text x="238" y="266" font-size="11" fill="#5a6472">convex: f &gt; 0, so P is +ve</text>
  </g>
</svg>
