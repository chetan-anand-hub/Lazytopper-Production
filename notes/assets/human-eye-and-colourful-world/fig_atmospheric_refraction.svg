<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" role="img" aria-label="Two panels. Top: a star's apparent position is raised by atmospheric refraction. Bottom: at sunrise and sunset the Sun is seen above the horizon while its actual position is below it.">
  <title>Atmospheric refraction</title>
  <desc>Traced from NCERT Science Class 10, The Human Eye and the Colourful World (ch.10), Fig. 10.9 "Apparent star position due to atmospheric refraction" and Fig. 10.10 "Atmospheric refraction effects at sunrise and sunset", both p168.</desc>
  <rect width="400" height="530" fill="#fcfdfe"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">

    <!-- ============ PANEL A - traced from Fig 10.9 ============ -->
    <text x="14" y="22" font-size="12.5" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">Twinkling &#183; apparent star position</text>

    <!-- real star -->
    <path d="M 96 112 l 5 -14 l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 z" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <text x="56" y="96" font-size="12.5" fill="#0f2444">Star</text>

    <!-- apparent star -->
    <path d="M 176 74 l 5 -14 l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 z" fill="none" stroke="#16b96a" stroke-width="2.5"/>
    <text x="198" y="58" font-size="12.5" fill="#0e8f52" font-weight="600">Apparent star</text>
    <text x="198" y="73" font-size="12.5" fill="#0e8f52" font-weight="600">position</text>

    <!-- curved ray path, star to observer -->
    <path d="M 116 122 Q 210 140 292 196" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <path d="M 294 198 L 281 189 L 284 200 Z" fill="#0f2444"/>
    <text x="120" y="154" font-size="11" fill="#5a6472">Ray path</text>

    <!-- dashed apparent line of sight -->
    <line x1="292" y1="196" x2="186" y2="84" stroke="#c3cbd6" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- refractive index increasing -->
    <line x1="46" y1="130" x2="46" y2="210" stroke="#0f2444" stroke-width="1.8"/>
    <path d="M 46 220 L 41 207 L 51 207 Z" fill="#0f2444"/>
    <text x="58" y="170" font-size="11" fill="#5a6472">Refractive index</text>
    <text x="58" y="184" font-size="11" fill="#5a6472">increasing</text>

    <!-- observer -->
    <circle cx="300" cy="208" r="7" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="300" y1="215" x2="300" y2="238" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="300" y1="222" x2="288" y2="202" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="300" y1="238" x2="292" y2="252" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="300" y1="238" x2="308" y2="252" stroke="#0f2444" stroke-width="1.8"/>
    <text x="270" y="270" font-size="11" fill="#5a6472">Observer</text>

    <line x1="14" y1="292" x2="386" y2="292" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- ============ PANEL B - traced from Fig 10.10 ============ -->
    <text x="14" y="322" font-size="12.5" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">Advance sunrise &#183; delayed sunset</text>

    <!-- atmosphere annulus -->
    <circle cx="150" cy="432" r="74" fill="#eef1f5" stroke="#c3cbd6" stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- earth -->
    <circle cx="150" cy="432" r="48" fill="#dfe5ec" stroke="#0f2444" stroke-width="1.8"/>
    <text x="129" y="437" font-size="12.5" fill="#0f2444">Earth</text>
    <text x="102" y="524" font-size="11" fill="#5a6472">Atmosphere</text>

    <!-- observer on the surface -->
    <circle cx="116" cy="398" r="4" fill="#16b96a"/>
    <text x="44" y="392" font-size="11" fill="#5a6472">Observer</text>

    <!-- horizon -->
    <line x1="186" y1="398" x2="358" y2="398" stroke="#c3cbd6" stroke-width="1.2"/>
    <text x="300" y="390" font-size="11" fill="#5a6472">Horizon</text>

    <!-- actual Sun, below the horizon -->
    <circle cx="322" cy="436" r="12" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <g stroke="#0f2444" stroke-width="1.8">
      <line x1="322" y1="418" x2="322" y2="412"/>
      <line x1="322" y1="454" x2="322" y2="460"/>
      <line x1="304" y1="436" x2="298" y2="436"/>
      <line x1="340" y1="436" x2="346" y2="436"/>
    </g>
    <text x="284" y="484" font-size="11" fill="#5a6472">actual Sun</text>
    <text x="284" y="498" font-size="11" fill="#5a6472">(below horizon)</text>

    <!-- apparent Sun, above the horizon -->
    <circle cx="322" cy="348" r="12" fill="none" stroke="#16b96a" stroke-width="2.5"/>
    <text x="246" y="336" font-size="12.5" fill="#0e8f52" font-weight="600">Apparent position</text>
    <text x="246" y="351" font-size="12.5" fill="#0e8f52" font-weight="600">of the Sun</text>

    <!-- curved refracted ray, Sun to observer -->
    <path d="M 310 432 Q 220 414 126 400" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <path d="M 122 400 L 135 394 L 134 405 Z" fill="#0f2444"/>

    <!-- dashed sight line, observer to apparent Sun -->
    <line x1="120" y1="396" x2="310" y2="350" stroke="#c3cbd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
</svg>
