<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="An observer standing on the ground looks up at an object above the horizontal level. The angle between the horizontal level and the line of sight is the angle of elevation.">
  <title>Angle of elevation</title>
  <desc>Redrawn as a labelled SVG from NCERT Mathematics Class 10 (Reprint 2026-27), Some Applications of Trigonometry (ch. 9), Fig. 9.2 "angle of elevation", p.134. The line of sight rises from the observer's eye to the object and carries an arrowhead towards the object; the horizontal level is a dashed ray from the eye; the angle between them is marked with an arc at the eye and named exactly as NCERT names it.</desc>
  <rect width="400" height="290" fill="#fcfdfe"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="14" y="22" font-size="13" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">Angle of elevation &#183; NCERT Fig. 9.2</text>

    <!-- ground -->
    <line x1="20" y1="258" x2="380" y2="258" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- observer standing on the ground -->
<circle cx="52" cy="204" r="7" fill="none" stroke="#0f2444" stroke-width="1.8"/>
<line x1="52" y1="211" x2="52" y2="238" stroke="#0f2444" stroke-width="1.8"/>
<line x1="52" y1="217" x2="40" y2="231" stroke="#0f2444" stroke-width="1.8"/>
<line x1="52" y1="217" x2="64" y2="231" stroke="#0f2444" stroke-width="1.8"/>
<line x1="52" y1="238" x2="44" y2="258" stroke="#0f2444" stroke-width="1.8"/>
<line x1="52" y1="238" x2="60" y2="258" stroke="#0f2444" stroke-width="1.8"/>
    <text x="52" y="274" font-size="12.5" fill="#5a6472" text-anchor="middle">Observer</text>

    <!-- horizontal level: dashed ray from the eye, arrowhead at the far end -->
    <line x1="60" y1="206" x2="369" y2="206" stroke="#0f2444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 380 206 L 369 210.5 L 369 201.5 Z" fill="#0f2444"/>
    <text x="252" y="223" font-size="12.5" fill="#0f2444">Horizontal level</text>

    <!-- line of sight: rises from the eye to the object, arrowhead at the object -->
    <line x1="60" y1="206" x2="301.6" y2="66.5" stroke="#16b96a" stroke-width="2.5"/>
    <path d="M 311.1 61 L 303.9 70.4 L 299.4 62.6 Z" fill="#16b96a"/>
    <text transform="rotate(-30 177.3 130.2)" x="177.3" y="130.2" font-size="12.5" fill="#0e8f52" font-weight="600" text-anchor="middle">Line of sight</text>

    <!-- object (a kite in NCERT), above the horizontal level -->
    <path d="M 322.8 47.3 L 329.8 54.3 L 322.8 61.3 L 315.8 54.3 Z" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <text x="322.8" y="39.3" font-size="12.5" fill="#0f2444" text-anchor="middle">Object</text>

    <!-- the angle: arc at the eye, from the horizontal up to the line of sight -->
    <path d="M 106 206 A 46 46 0 0 0 99.8 183" fill="none" stroke="#16b96a" stroke-width="2"/>
    <text x="112" y="197" font-size="12.5" fill="#0e8f52" font-weight="600">Angle of elevation</text>

    <!-- the eye (vertex of the angle) -->
    <circle cx="60" cy="206" r="2.6" fill="#16b96a"/>
  </g>
</svg>
