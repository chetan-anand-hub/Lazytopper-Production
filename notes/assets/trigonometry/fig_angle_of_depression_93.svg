<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-label="An observer on a balcony looks down at an object on the ground below the horizontal level. The angle between the horizontal level and the line of sight is the angle of depression.">
  <title>Angle of depression</title>
  <desc>Redrawn as a labelled SVG from NCERT Mathematics Class 10 (Reprint 2026-27), Some Applications of Trigonometry (ch. 9), Fig. 9.3 "angle of depression", p.134. The line of sight falls from the observer's eye to the object on the ground and carries an arrowhead towards the object; the horizontal level is a dashed ray from the eye; the angle between them is marked with an arc at the eye and named exactly as NCERT names it.</desc>
  <rect width="400" height="272" fill="#fcfdfe"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="14" y="22" font-size="13" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">Angle of depression &#183; NCERT Fig. 9.3</text>

    <!-- balcony: building face, floor edge and wall edge -->
    <rect x="16" y="104" width="68" height="136" fill="#eef1f5"/>
    <line x1="16" y1="104" x2="84" y2="104" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="84" y1="104" x2="84" y2="240" stroke="#0f2444" stroke-width="1.8"/>
    <text x="16" y="258" font-size="12.5" fill="#5a6472">Observer on a balcony</text>

    <!-- ground -->
    <line x1="84" y1="240" x2="380" y2="240" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- observer standing on the balcony -->
<circle cx="70" cy="58" r="7" fill="none" stroke="#0f2444" stroke-width="1.8"/>
<line x1="70" y1="65" x2="70" y2="84" stroke="#0f2444" stroke-width="1.8"/>
<line x1="70" y1="71" x2="58" y2="85" stroke="#0f2444" stroke-width="1.8"/>
<line x1="70" y1="71" x2="82" y2="85" stroke="#0f2444" stroke-width="1.8"/>
<line x1="70" y1="84" x2="62" y2="104" stroke="#0f2444" stroke-width="1.8"/>
<line x1="70" y1="84" x2="78" y2="104" stroke="#0f2444" stroke-width="1.8"/>

    <!-- horizontal level: dashed ray from the eye, arrowhead at the far end -->
    <line x1="77" y1="60" x2="369" y2="60" stroke="#0f2444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 380 60 L 369 64.5 L 369 55.5 Z" fill="#0f2444"/>
    <text x="252" y="52" font-size="12.5" fill="#0f2444">Horizontal level</text>

    <!-- line of sight: falls from the eye to the object, arrowhead at the object -->
    <line x1="77" y1="60" x2="319.7" y2="220.8" stroke="#16b96a" stroke-width="2.5"/>
    <path d="M 328.8 226.9 L 317.2 224.6 L 322.1 217.1 Z" fill="#16b96a"/>
    <text transform="rotate(33.5 190.6 152.1)" x="190.6" y="152.1" font-size="12.5" fill="#0e8f52" font-weight="600" text-anchor="middle">Line of sight</text>

    <!-- object (a flower pot in NCERT), on the ground below the horizontal level -->
    <circle cx="338" cy="233" r="6" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <circle cx="338" cy="233" r="2" fill="#0f2444"/>
    <text x="338" y="258" font-size="12.5" fill="#0f2444" text-anchor="middle">Object</text>

    <!-- the angle: arc at the eye, from the horizontal down to the line of sight -->
    <path d="M 123 60 A 46 46 0 0 1 115.3 85.4" fill="none" stroke="#16b96a" stroke-width="2"/>
    <text x="130" y="82" font-size="12.5" fill="#0e8f52" font-weight="600">Angle of depression</text>

    <!-- the eye (vertex of the angle) -->
    <circle cx="77" cy="60" r="2.6" fill="#16b96a"/>
  </g>
</svg>
