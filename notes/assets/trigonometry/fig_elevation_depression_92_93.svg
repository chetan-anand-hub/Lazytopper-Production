<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" role="img" aria-label="Two panels. Top: an observer on the ground looks up at an object above the horizontal level; the angle between the horizontal and the line of sight is the angle of elevation. Bottom: an observer on a balcony looks down at an object below the horizontal level; the angle between the horizontal and the line of sight is the angle of depression.">
  <title>Angle of elevation and angle of depression</title>
  <desc>Redrawn as a labelled SVG from NCERT Mathematics Class 10 (Reprint 2026-27), Some Applications of Trigonometry (ch. 9): Fig. 9.2 "angle of elevation" and Fig. 9.3 "angle of depression", both on p.134. Each line of sight carries an arrowhead towards the object; each angle is marked with an arc at the observer's eye and named exactly as NCERT names it.</desc>
  <rect width="400" height="530" fill="#fcfdfe"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">

    <!-- ============ PANEL A - redrawn from Fig. 9.2 (angle of elevation) ============ -->
    <text x="14" y="22" font-size="12.5" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">(a) Angle of elevation &#183; NCERT Fig. 9.2</text>

    <!-- ground -->
    <line x1="24" y1="248" x2="376" y2="248" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- observer standing on the ground -->
    <circle cx="56" cy="194" r="7" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="56" y1="201" x2="56" y2="230" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="56" y1="208" x2="44" y2="222" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="56" y1="208" x2="68" y2="222" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="56" y1="230" x2="48" y2="248" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="56" y1="230" x2="64" y2="248" stroke="#0f2444" stroke-width="1.8"/>
    <text x="34" y="264" font-size="11" fill="#5a6472">Observer</text>

    <!-- horizontal level: dashed ray from the eye, arrowhead at the far end -->
    <line x1="64" y1="196" x2="368" y2="196" stroke="#0f2444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 380 196 L 369 191.5 L 369 200.5 Z" fill="#0f2444"/>
    <text x="252" y="189" font-size="12.5" fill="#0f2444">Horizontal level</text>

    <!-- line of sight: rises from the eye to the object, arrowhead at the object -->
    <line x1="64" y1="196" x2="319.2" y2="74.2" stroke="#16b96a" stroke-width="2.5"/>
    <path d="M 330 69 L 321.1 78.3 L 317.3 70.1 Z" fill="#16b96a"/>
    <text transform="rotate(-25.5 164.8 134.5)" x="164.8" y="134.5" font-size="12.5" fill="#0e8f52" font-weight="600">Line of sight</text>

    <!-- object, above the horizontal level -->
    <path d="M 340 55 L 347 62 L 340 69 L 333 62 Z" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <text x="330" y="46" font-size="12.5" fill="#0f2444">Object</text>

    <!-- the angle: arc at the eye, from the horizontal up to the line of sight -->
    <path d="M 110 196 A 46 46 0 0 0 105.5 176.2" fill="none" stroke="#16b96a" stroke-width="2"/>
    <text x="116" y="186" font-size="12.5" fill="#0e8f52" font-weight="600">Angle of elevation</text>

    <!-- the eye (vertex of the angle) -->
    <circle cx="64" cy="196" r="2.6" fill="#16b96a"/>

    <line x1="14" y1="276" x2="386" y2="276" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- ============ PANEL B - redrawn from Fig. 9.3 (angle of depression) ============ -->
    <text x="14" y="294" font-size="12.5" fill="#0f2444" font-weight="600" font-family="Fraunces, Georgia, serif">(b) Angle of depression &#183; NCERT Fig. 9.3</text>

    <g transform="translate(0 6)">
    <!-- balcony: building face, floor edge and wall edge -->
    <rect x="20" y="360" width="76" height="154" fill="#eef1f5"/>
    <line x1="20" y1="360" x2="96" y2="360" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="96" y1="360" x2="96" y2="514" stroke="#0f2444" stroke-width="1.8"/>
    <text x="30" y="384" font-size="11" fill="#5a6472">Observer</text>
    <text x="30" y="398" font-size="11" fill="#5a6472">on a balcony</text>

    <!-- ground -->
    <line x1="96" y1="514" x2="376" y2="514" stroke="#c3cbd6" stroke-width="1.2"/>

    <!-- observer standing on the balcony -->
    <circle cx="82" cy="314" r="7" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="82" y1="321" x2="82" y2="342" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="82" y1="327" x2="72" y2="338" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="82" y1="327" x2="92" y2="338" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="82" y1="342" x2="76" y2="360" stroke="#0f2444" stroke-width="1.8"/>
    <line x1="82" y1="342" x2="88" y2="360" stroke="#0f2444" stroke-width="1.8"/>

    <!-- horizontal level: dashed ray from the eye, arrowhead at the far end -->
    <line x1="89" y1="316" x2="368" y2="316" stroke="#0f2444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 380 316 L 369 311.5 L 369 320.5 Z" fill="#0f2444"/>
    <text x="252" y="309" font-size="12.5" fill="#0f2444">Horizontal level</text>

    <!-- line of sight: falls from the eye to the object, arrowhead at the object -->
    <line x1="89" y1="316" x2="320.6" y2="472.3" stroke="#16b96a" stroke-width="2.5"/>
    <path d="M 330.5 479 L 318.1 476 L 323.1 468.6 Z" fill="#16b96a"/>
    <text transform="rotate(34 206.7 380.9)" x="206.7" y="380.9" font-size="12.5" fill="#0e8f52" font-weight="600">Line of sight</text>

    <!-- object, below the horizontal level -->
    <circle cx="338" cy="484" r="5" fill="none" stroke="#0f2444" stroke-width="1.8"/>
    <circle cx="338" cy="484" r="1.8" fill="#0f2444"/>
    <text x="324" y="506" font-size="12.5" fill="#0f2444">Object</text>

    <!-- the angle: arc at the eye, from the horizontal down to the line of sight -->
    <path d="M 135 316 A 46 46 0 0 1 127.1 341.7" fill="none" stroke="#16b96a" stroke-width="2"/>
    <text x="142" y="338" font-size="12.5" fill="#0e8f52" font-weight="600">Angle of depression</text>

    <!-- the eye (vertex of the angle) -->
    <circle cx="89" cy="316" r="2.6" fill="#16b96a"/>
    </g>
  </g>
</svg>
