    <!-- PRELOAD NET. A lazy route's stylesheet that fails to load must not send the
         whole page to the error boundary. Vite's preload helper dispatches a cancelable
         `vite:preloadError` and rethrows only if nobody cancelled it; cancelling a CSS
         failure lets the route's module import go ahead, so the page renders with that
         one stylesheet missing. Deliberately narrow: a failed JS chunk import reaches the
         same event, and cancelling THAT would hand React.lazy an undefined module, so it
         is left to throw. No global error or unhandledrejection handler.
         ⚠ Keep this an inline script ABOVE the module script (at build, Vite moves that
         script to the end of this head, still after this one). It must be registered
         before the app starts loading chunks; a listener added from module code is
         registered too late to matter. src/config/preloadNet.guard.test.ts pins it. -->
    <script>
      window.addEventListener("vite:preloadError", function (event) {
        var reason = event.payload;
        var message = reason && reason.message ? String(reason.message) : "";
        if (message.indexOf("Unable to preload CSS for ") !== 0) return;
        event.preventDefault();
        console.warn("[preload-net] rendering without a stylesheet. " + message);
      });
    </script>
    <!-- VERCEL WEB ANALYTICS. Cookieless, no npm dependency, and no new data processor:
         Vercel already serves every request here. Page views are answered by
         src/analytics/, NOT by this script.

         ⚠ `data-disable-auto-track="1"` IS LOAD-BEARING, NOT A PREFERENCE. Left on, the
         script sends its own page view from `window.location` the instant it loads —
         before any app code runs. That would double-count every first view, and on
         `/u/<token>` it would transmit a LIVE 256-bit single-use capability token
         (App.tsx:1235) to the vendor in plain text. Off, no page view leaves this app
         that has not been through normalisePath().

         `beforeSend` is the second line of defence: the vendor stamps its own `url` on
         every event it sends, which our redaction of the `path` argument does not touch.
         This scrubs that too, with the SAME rules as normalisePath() in
         src/analytics/analytics.ts: query and hash dropped, /u/<token> -> /u/:token, a
         segment carrying an email -> :email, an opaque 20+-character id -> :id (lowercase
         kebab-case content slugs kept), no trailing slash, capped at 200. The GA4 block
         below carries the same function, because each inline block must stand alone.
         src/analytics/indexHtml.guard.test.ts reads this file from disk, pins both
         properties, and RUNS both copies against normalisePath() on the same cases. -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
      (function () {
        function ltRedactPath(p) {
          p = String(p || "/").split("?")[0].split("#")[0];
          if (p.charAt(0) !== "/") p = "/" + p;
          if (/^\/u\/[^/]+.*$/.test(p)) p = "/u/:token";
          p = p
            .split("/")
            .map(function (s) {
              if (/@|%40/i.test(s)) return ":email";
              if (/^[A-Za-z0-9_-]{20,}$/.test(s) && !/^[a-z]+(?:-[a-z0-9]+)*$/.test(s)) return ":id";
              return s;
            })
            .join("/");
          if (p.length > 1 && p.charAt(p.length - 1) === "/") p = p.slice(0, -1);
          if (p.length > 200) p = p.slice(0, 200);
          return p;
        }
        window.va("beforeSend", function (event) {
          if (!event || typeof event.url !== "string") return event;
          var m = /^([a-z][a-z0-9+.-]*:\/\/[^\/?#]*)?(.*)$/i.exec(event.url);
          event.url = (m[1] || "") + ltRedactPath(m[2]);
          return event;
        });
      })();
    </script>
    <script defer src="/_vercel/insights/script.js" data-disable-auto-track="1"></script>
    <!-- GOOGLE ANALYTICS 4 (GA4-1, owner rulings 2026-09-29). Measures ad conversions
         (sign_up) and, by the owner's second ruling, feeds Google Ads remarketing: Google
         Signals and ad personalisation are ON. It sets cookies; the Privacy Policy says so.

         ★ ON A /u/ HAND-OFF LINK (/u/... or /app/u/...) THIS DOES NOTHING AT ALL: no
         Google script is requested and no gtag / dataLayer exists, because that path IS
         a live single-use capability token. The same holds for the loopback / webdriver
         contexts that src/analytics/analytics.ts already treats as automated.

         What is NOT negotiable (security, not advertising): send_page_view is false
         (page views are sent by src/analytics/, after normalisePath), and the address
         and referrer handed to Google are redacted here, by the same rule analytics.ts
         applies to every later hit: origin + normalisePath(app path) (/u/:token, :email,
         :id, no trailing slash, capped at 200) + ONLY gclid and utm_* query parameters,
         no hash; the referrer is reduced to its origin. The app is served at the domain
         root (ROOT-URL-1), so BASE is empty.
         src/analytics/indexHtml.guard.test.ts runs this block and pins all of it. -->
    <script>
      (function () {
        var loc = window.location;
        var full = loc.pathname || "/";
        if (/^(?:\/app)?\/u(?:\/|$)/.test(full)) return;
        var host = loc.hostname;
        if (
          host === "127.0.0.1" ||
          host === "localhost" ||
          host === "::1" ||
          host === "[::1]" ||
          host === "0.0.0.0" ||
          /\.local$/.test(host) ||
          window.navigator.webdriver === true
        )
          return;
        function ltRedactPath(p) {
          p = String(p || "/").split("?")[0].split("#")[0];
          if (p.charAt(0) !== "/") p = "/" + p;
          if (/^\/u\/[^/]+.*$/.test(p)) p = "/u/:token";
          p = p
            .split("/")
            .map(function (s) {
              if (/@|%40/i.test(s)) return ":email";
              if (/^[A-Za-z0-9_-]{20,}$/.test(s) && !/^[a-z]+(?:-[a-z0-9]+)*$/.test(s)) return ":id";
              return s;
            })
            .join("/");
          if (p.length > 1 && p.charAt(p.length - 1) === "/") p = p.slice(0, -1);
          if (p.length > 200) p = p.slice(0, 200);
          return p;
        }
        var BASE = "";
        var path = ltRedactPath(full === BASE || full.indexOf(BASE + "/") === 0 ? full.slice(BASE.length) : full);
        var kept = [];
        var parts = String(loc.search || "").replace(/^\?/, "").split("&");
        for (var i = 0; i < parts.length; i++) {
          var key = parts[i].split("=")[0];
          if (key === "gclid" || key.indexOf("utm_") === 0) kept.push(parts[i]);
        }
        var ref = /^(https?:\/\/)(?:[^\/?#@]*@)?([^\/?#@]+)/i.exec(String(document.referrer || ""));
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", "G-1T8Q12H4RQ", {
          send_page_view: false,
          allow_google_signals: true,
          allow_ad_personalization_signals: true,
          page_location: loc.origin + BASE + path + (kept.length ? "?" + kept.join("&") : ""),
          page_referrer: ref ? ref[1] + ref[2] + "/" : ""
        });
        var tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=G-1T8Q12H4RQ";
        document.head.appendChild(tag);
      })();
    </script>
  </head>
