<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | LazyTopper</title>
<meta name="description" content="This page does not exist on LazyTopper." />
<meta name="robots" content="noindex,follow" />
<meta name="theme-color" content="#0f1b33" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<style>
  :root { --navy: #0f1b33; --navy-2: #172746; --white: #f8fafc; --muted: #a9b6cc; --green: #22c55e; --green-2: #16a34a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--navy);
    color: var(--white);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 32px 24px;
    background: var(--navy-2);
    border: 1px solid rgba(248, 250, 252, 0.12);
    border-radius: 16px;
    text-align: center;
  }
  .brand { margin: 0 0 20px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: var(--green); }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 16px; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  a {
    display: block;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(248, 250, 252, 0.28);
    color: var(--white);
    font-weight: 600;
    text-decoration: none;
  }
  a:hover, a:focus-visible { border-color: var(--green); outline: none; }
  a.primary { background: var(--green); border-color: var(--green); color: var(--navy); }
  a.primary:hover, a.primary:focus-visible { background: var(--green-2); border-color: var(--green-2); color: var(--white); }
</style>
</head>
<body>
<main>
  <p class="brand">LAZYTOPPER</p>
  <h1>Page not found</h1>
  <p>This page does not exist. The address may have a typo, or the page may have moved.</p>
  <nav aria-label="Where to go next">
    <a class="primary" href="/">Home</a>
    <a href="/practice-hub">Practice hub</a>
    <a href="/cbse/class-10">CBSE Class 10</a>
  </nav>
</main>
</body>
</html>
