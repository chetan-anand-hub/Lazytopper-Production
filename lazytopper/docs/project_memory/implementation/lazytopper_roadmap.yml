lazytopper:
  title: "LazyTopper Core Roadmap"
  allowedSystemTouchPrefixes:
    - "src/"
    - "docs/"
    - "scripts/"
    - ".github/"
    - "package.json"
  stages:
    - id: "R8"
      title: "Stabilize CI + repo hygiene permanently"
    - id: "R8-3"
      title: "Optional: Mindmap UX polish micro-stage (collapse branches, exam toggle, guided path, search/filter)"
    - id: "R9"
      title: "Finalize PR workflow + release notes/changelog"
    - id: "R10"
      title: "TopicHub expansion + UX polish (search/filter, guided path)"
    - id: "R11"
      title: "Socratic solutions: add solutionSteps[] + render in MockPaper/HPQ"
    - id: "R12"
      title: "AI Mentor v1: concept → explain → practice → assess loop"
    - id: "R13"
      title: "Adaptive practice: difficulty mix + wrong-answer logs → follow-ups"
    - id: "R14"
      title: "Multi-subject scale-out: Class 10 Science + seeds for Class 12 Maths/Physics"
    - id: "R15"
      title: "Personalization: hosting + Firebase Auth/Firestore + dashboards/planner"
    - id: "R16"
      title: "Quality & safety: QA rubric, regression checks, schema validation, CI enforcement"
    - id: "R17"
      title: "Launch readiness: onboarding, marketing, analytics, performance optimizations"
