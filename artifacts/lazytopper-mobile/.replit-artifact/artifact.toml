kind = "mobile"
previewPath = "/lazytopper-mobile/"
title = "LazyTopper Mobile"
version = "1.0.0"
id = "artifacts/lazytopper-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/lazytopper-mobile/" ]
localPort = 23207

[services.development]
run = "pnpm --filter @workspace/lazytopper-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lazytopper-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lazytopper-mobile", "run", "serve" ]

[services.env]
PORT = "23207"
BASE_PATH = "/lazytopper-mobile/"
