kind = "web"
previewPath = "/"
title = "LazyTopper"
version = "1.0.0"
id = "artifacts/lazytopper-app"

[[services]]
name = "web"
paths = ["/"]
localPort = 25246

[services.development]
run = "cd /home/runner/workspace/lazytopper && PORT=25246 npx vite --host 0.0.0.0"

[services.production]
serve = "static"
publicDir = "artifacts/lazytopper-app/dist/public"
build = ["pnpm", "--filter", "@workspace/lazytopper-app", "run", "build"]

[[services.production.rewrites]]
from = "/app/*"
to = "/app/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25246"
NODE_ENV = "production"
