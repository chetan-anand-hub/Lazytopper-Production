kind = "web"
  previewPath = "/"
  title = "LazyTopper"
  version = "1.0.0"
  id = "artifacts/lazytopper-app"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = ["/"]
  localPort = 25246

  [services.development]
  run = "cd /home/runner/workspace/lazytopper && PORT=$PORT npx vite"

  [services.production]
  publicDir = "artifacts/lazytopper-app/dist/public"
  serve = "static"

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/lazytopper-app", "run", "build"]

  [services.production.build.env]
  NODE_ENV = "production"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "25246"
  BASE_PATH = "/"
  