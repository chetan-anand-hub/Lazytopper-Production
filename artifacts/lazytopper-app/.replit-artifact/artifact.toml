kind = "web"
  previewPath = "/"
  title = "LazyTopper"
  version = "1.0.0"
  id = "artifacts/lazytopper-app"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = ["/"]
  localPort = 25246

  [services.development]
  run = "cd /home/runner/workspace/lazytopper && PORT=$PORT npx vite"

  [services.production]

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/lazytopper-app", "run", "build"]

  [services.production.build.env]
  NODE_ENV = "production"

  [services.production.run]
  args = ["node", "artifacts/lazytopper-app/serve-production.cjs"]

  [services.production.run.env]
  PORT = "25246"
  NODE_ENV = "production"

  [services.production.health.startup]
  path = "/"

  [services.env]
  PORT = "25246"
  BASE_PATH = "/"
  