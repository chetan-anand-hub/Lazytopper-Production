kind = "web"
  previewPath = "/__vite-dev"
  title = "LazyTopper Dev (HMR)"
  version = "1.0.0"
  id = "artifacts/lazytopper-app"

  [[services]]
  name = "vite-dev"
  paths = ["/__vite-dev"]
  localPort = 25246

  [services.development]
