kind = "web"
  previewPath = "/"
  title = "LazyTopper"
  version = "1.0.0"
  id = "artifacts/lazytopper-app"

  [[services]]
  name = "web"
  paths = ["/"]
  localPort = 25246

  [services.development]
  run = "cd /home/runner/workspace/lazytopper && PORT=25246 npx vite --host 0.0.0.0"

  [services.production]
  serve = "static"
  publicDir = "lazytopper/dist"

  [services.production.build]
  args = ["bash", "-c", "cd /home/runner/workspace/lazytopper && npx vite build"]

  [services.production.build.env]
  NODE_ENV = "production"

  [services.env]
  PORT = "25246"
