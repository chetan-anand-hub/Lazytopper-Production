kind = "web"
  previewPath = "/"
  title = "LazyTopper"
  version = "1.0.0"
  id = "artifacts/lazytopper-app"

  [[services]]
  name = "web"
  paths = ["/"]
  localPort = 25246

  [services.development]
  run = "pnpm --filter @workspace/lazytopper-app run dev"

  [services.production]

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/lazytopper-app", "run", "build"]

  [services.production.build.env]
  NODE_ENV = "production"

  [services.production.run]
  args = ["pnpm", "--filter", "@workspace/lazytopper-app", "run", "serve"]

  [services.production.run.env]
  PORT = "25246"
  NODE_ENV = "production"

  [services.production.health.startup]
  path = "/"

  [services.env]
  PORT = "25246"
