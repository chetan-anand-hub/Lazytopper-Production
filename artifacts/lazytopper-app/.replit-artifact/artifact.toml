kind = "web"
previewPath = "/"
title = "LazyTopper"
version = "1.0.0"
id = "artifacts/lazytopper-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25246

[services.development]
run = "cd /home/runner/workspace/lazytopper && PORT=25246 npx vite"

[services.production]
build = [ "bash", "-c", "cd /home/runner/workspace/lazytopper && npx vite build" ]
publicDir = "lazytopper/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25246"
BASE_PATH = "/"
