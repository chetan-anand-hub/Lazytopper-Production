kind = "video"
previewPath = "/lazytopper-video/"
title = "LazyTopper Explainer"
version = "1.0.0"
id = "artifacts/lazytopper-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/lazytopper-video/" ]
localPort = 18311

[services.development]
run = "pnpm --filter @workspace/lazytopper-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lazytopper-video", "run", "build" ]
publicDir = "artifacts/lazytopper-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18311"
BASE_PATH = "/lazytopper-video/"
